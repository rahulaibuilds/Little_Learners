services:
  mysql:
    image: mysql:8.0
    container_name: learnnest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: learnnest
      MYSQL_USER: learnnest_user
      MYSQL_PASSWORD: learnnest_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - learnnest-network

  redis:
    image: redis:7-alpine
    container_name: learnnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - learnnest-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: learnnest-web
    environment:
      - DATABASE_URL=mysql://learnnest_user:learnnest_password@mysql:3306/learnnest
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnnest-network
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  mysql_data:
  redis_data:

networks:
  learnnest-network:
    driver: bridge