version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: learnnest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learnnest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learnnest-network

  redis:
    image: redis:7-alpine
    container_name: learnnest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - learnnest-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: learnnest-web
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/learnnest?schema=public
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - learnnest-network
    command: sh -c "npm run db:migrate && npm run dev"

volumes:
  postgres_data:
  redis_data:

networks:
  learnnest-network:
    driver: bridge